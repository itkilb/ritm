; Production PHP-FPM pool for the two-concurrent-request limit.
; The image entrypoint remains the default one: it creates .env, initialises
; persistent storage and generates Passport keys before php-fpm starts.
[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
chdir = /var/www/html

; Laravel reads configuration from container environment variables.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 200

request_terminate_timeout = 60s
