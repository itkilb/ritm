# Production nginx for the private `web` service. Caddy is the only ingress and
# always overwrites X-Forwarded-* before proxying here.

# Caddy sends a single client IP. Trust only container/private networks, never
# arbitrary public peers (the service is not published externally).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1/32;
set_real_ip_from ::1/128;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Re-resolve the backend through Docker DNS after a recreate instead of pinning
# the old container IP at nginx startup.
resolver 127.0.0.11 valid=10s ipv6=off;

# Laravel has no TrustProxies middleware in this project. Derive the FastCGI
# HTTPS state and public port from the proto that Caddy sets.
map $http_x_forwarded_proto $ritm_https {
    default off;
    ~*^https on;
}

map $ritm_https $ritm_scheme {
    default http;
    on https;
}

map $ritm_https $ritm_port {
    default 80;
    on 443;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 12m;

    set $backend_fpm "backend:9000";

    # Container healthcheck, never proxied to PHP.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API. /v1 is executed by Laravel's front controller.
    location ^~ /v1 {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTPS $ritm_https;
        fastcgi_param REQUEST_SCHEME $ritm_scheme;
        fastcgi_param SERVER_PORT $ritm_port;
        fastcgi_pass $backend_fpm;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 60s;
    }

    # Sanctum's CSRF-cookie endpoint for the product session.
    location = /sanctum/csrf-cookie {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTPS $ritm_https;
        fastcgi_param REQUEST_SCHEME $ritm_scheme;
        fastcgi_param SERVER_PORT $ritm_port;
        fastcgi_pass $backend_fpm;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 60s;
    }

    # Vite emits hashed asset names; they can be cached for a long time.
    location ~* \.(?:css|js|mjs|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: direct URLs such as /register, /login, /onboarding,
    # /dashboard, /workouts and /progress return the application shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
