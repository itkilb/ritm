; Production PHP settings. This file is mounted into conf.d and therefore
; overrides the development defaults baked into the PHP image.
memory_limit = 128M
upload_max_filesize = 12M
post_max_size = 12M
max_execution_time = 60

date.timezone = UTC
expose_php = Off
display_errors = Off
log_errors = On
zend.exception_ignore_args = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
