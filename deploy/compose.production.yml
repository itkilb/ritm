# Production-only stack. This file is intentionally standalone: it is not merged
# with docker-compose.yml and it must not build images on the server.
#
# Run from the repository root:
#   docker compose --env-file .env.production -f deploy/compose.production.yml ...
#
# .env.production is only used for interpolation on the host. It is deliberately
# not attached as env_file to any service, so MYSQL_ROOT_PASSWORD and other
# unrelated values never reach the backend container.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ritm}
      MYSQL_USER: ${MYSQL_USER:-ritm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql.cnf:/etc/mysql/conf.d/ritm.cnf:ro
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    stop_grace_period: 45s
    mem_limit: 384m
    memswap_limit: 768m
    logging: *default-logging
    networks:
      - internal

  backend:
    image: ${BACKEND_IMAGE:-ritm-backend:b950e2e-amd64}
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Ritm}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: https://${DOMAIN:?DOMAIN is required}
      API_URL: https://${DOMAIN:?DOMAIN is required}
      FRONTEND_URL: https://${DOMAIN:?DOMAIN is required}
      APP_LOCALE: ru
      APP_TIMEZONE: UTC
      TZ: UTC
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      HOME: /tmp

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-ritm}
      DB_USERNAME: ${MYSQL_USER:-ritm}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

      CACHE_STORE: file
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      SANCTUM_STATEFUL_DOMAINS: ${DOMAIN:?DOMAIN is required},www.${DOMAIN:?DOMAIN is required}

      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      HASH_ID: "true"
      HASH_ID_KEY: ${HASH_ID_KEY:?HASH_ID_KEY is required}
    volumes:
      - backend_storage:/var/www/html/storage
      - ./php.ini:/usr/local/etc/php/conf.d/99-ritm.ini:ro
      - ./php-fpm.conf:/usr/local/etc/php-fpm.d/zz-ritm.conf:ro
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 256m
    memswap_limit: 512m
    logging: *default-logging
    networks:
      - internal

  web:
    image: ${WEB_IMAGE:-ritm-web:b950e2e-amd64}
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    logging: *default-logging
    networks:
      - internal
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      GOMEMLIMIT: 64MiB
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m
    logging: *default-logging
    networks:
      - edge

volumes:
  mysql_data:
    name: ritm_prod_mysql_data
  backend_storage:
    name: ritm_prod_backend_storage
  caddy_data:
    name: ritm_prod_caddy_data
  caddy_config:
    name: ritm_prod_caddy_config

networks:
  internal:
    name: ritm_prod_internal
    internal: true
  edge:
    name: ritm_prod_edge
